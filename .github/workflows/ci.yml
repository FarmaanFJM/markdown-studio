name: CI

# Runner and trigger policy: docs/CI.md. In short:
#   * Linux jobs run on the dedicated self-hosted runner (labels: self-hosted, linux,
#     markdown-studio-linux). There is no hosted fallback: if that runner is offline the job queues.
#   * Pull requests from forks never touch the self-hosted runner; they run the Linux gates on a
#     GitHub-hosted runner (the only hosted Linux use).
#   * Windows and macOS (hosted, native) run only for main, release tags and manual runs.
on:
  push:
    branches: ['**']
    tags: ['v*']
  # Branches of this repository are covered by `push`; this runs CI for pull requests from forks.
  pull_request:
  workflow_dispatch:
    inputs:
      benchmark:
        description: 'Also run the informational performance benchmark'
        type: boolean
        default: true

permissions:
  contents: read

# Development runs are cancelled by newer commits. Release tags, main and manual runs are never
# cancelled by a later push (manual runs also get their own group so they cannot cancel a push run).
concurrency:
  group: ci-${{ github.event_name == 'workflow_dispatch' && 'manual-' || '' }}${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' && github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

# Signing is optional. Without the signing secrets the artifacts are produced unsigned and the
# workflow says so; nothing is ever signed with a substitute certificate (see docs/RELEASING.md).

jobs:
  linux:
    name: Quality gates and desktop E2E (Linux)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name != github.repository
    # Fail-closed: only a non-pull_request event (a push by someone with write access, or a manual
    # run) can select the self-hosted runner. Every pull_request event, i.e. fork code, is hosted.
    runs-on: ${{ github.event_name == 'pull_request' && 'ubuntu-latest' || fromJSON('["self-hosted","linux","markdown-studio-linux"]') }}
    timeout-minutes: 50
    outputs:
      code: ${{ steps.scope.outputs.code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      # Documentation-only pushes keep the cheap gates (lint, formatting, typecheck, unit tests,
      # which include the docs link test) and skip build, E2E and packaging. Tags, manual runs,
      # pull requests and anything that cannot be diffed always run everything.
      - name: Decide whether code changed
        id: scope
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          code=true
          if [ "$EVENT" = push ] && [[ "$REF" == refs/heads/* ]] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            files="$(git diff --name-only "$BEFORE" "$SHA")"
            if [ -n "$files" ] && ! printf '%s\n' "$files" | grep -qvE '^(docs/|README\.md$|CHANGELOG\.md$)'; then
              code=false
            fi
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Code changed (heavy jobs run): $code" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          # The persistent runner keeps ~/.npm itself; the remote cache only helps hosted runners.
          cache: ${{ github.event_name == 'pull_request' && 'npm' || '' }}
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Formatting check
        run: npm run format:check
      - name: TypeScript typecheck
        run: npm run typecheck
      - name: Unit tests
        run: npm run test:unit
      - name: Application build
        if: steps.scope.outputs.code == 'true'
        run: npm run build
      # Real Electron windows on a virtual display.
      - name: Security regression tests (unit and Electron)
        if: steps.scope.outputs.code == 'true'
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:security
      - name: Export rendering tests (math, diagrams, themes, PDF, HTML, presets)
        if: steps.scope.outputs.code == 'true'
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e:export
      - name: Core editor E2E tests (Phase 1 and 2)
        if: steps.scope.outputs.code == 'true'
        run: xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e:core
      - name: Package the Linux AppImage
        if: steps.scope.outputs.code == 'true'
        run: npx electron-builder --linux --publish never
      - name: Test the packaged Linux application
        if: steps.scope.outputs.code == 'true'
        run: |
          APPIMAGE="$(ls release/*/Markdown-Studio-*.AppImage | head -1)"
          chmod +x "$APPIMAGE"
          (cd release && "../$APPIMAGE" --appimage-extract >/dev/null)
          MARKDOWN_STUDIO_EXECUTABLE="$PWD/release/squashfs-root/markdown-studio" \
            xvfb-run -a -s "-screen 0 1440x900x24" npm run test:e2e:packaged
      # The AppImage is large: keep it only where it is consumed (release) or wanted (main, manual).
      - uses: actions/upload-artifact@v4
        if: steps.scope.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
        with:
          name: markdown-studio-linux-appimage
          path: release/*/Markdown-Studio-*.AppImage
          if-no-files-found: error
          retention-days: ${{ startsWith(github.ref, 'refs/tags/v') && 14 || 3 }}
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: linux-test-results
          path: test-results/
          retention-days: 7
      # The runner is persistent: do not leave Electron or Xvfb processes from this workspace behind.
      - name: Stop leftover processes from this workspace
        if: always() && github.event_name != 'pull_request'
        run: pkill -u "$(id -u)" -f "$GITHUB_WORKSPACE" || true

  performance:
    name: Performance benchmark (Linux, informational)
    needs: linux
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.benchmark)
    runs-on: [self-hosted, linux, markdown-studio-linux]
    timeout-minutes: 40
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run build
      - run: xvfb-run -a -s "-screen 0 1440x900x24" npm run benchmark -- --quick --out benchmark.json
      - uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: benchmark.json
          retention-days: 30
      - name: Stop leftover processes from this workspace
        if: always()
        run: pkill -u "$(id -u)" -f "$GITHUB_WORKSPACE" || true

  windows:
    name: Desktop E2E, installer and packaged-app tests (Windows)
    needs: linux
    # Native platforms: main, release tags and manual runs only (never ordinary development pushes
    # or fork pull requests), and only after the Linux gates pass and code changed.
    if: needs.linux.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: windows-latest
    timeout-minutes: 80
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:unit
      - run: npm run build
      # The installer is built and uploaded first so it exists even when a later (timing-sensitive)
      # E2E test fails; the job, and the release job that depends on it, still fail in that case.
      - name: Build the Windows installer
        shell: bash
        env:
          WINDOWS_CERTIFICATE_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          # electron-builder signs only when a certificate is provided; an empty CSC_LINK would be
          # read as a path, so the variables are exported only when the secrets exist.
          if [ -n "$WINDOWS_CERTIFICATE_BASE64" ]; then
            export CSC_LINK="$WINDOWS_CERTIFICATE_BASE64" CSC_KEY_PASSWORD="$WINDOWS_CERTIFICATE_PASSWORD"
          fi
          npx electron-builder --win --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-studio-windows-installer
          path: release/*/Markdown-Studio-Setup-*.exe
          if-no-files-found: error
          retention-days: 30
      - name: Report the signing status of the installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem release\*\Markdown-Studio-Setup-*.exe | Select-Object -First 1
          $signature = Get-AuthenticodeSignature $installer.FullName
          "Installer: $($installer.Name)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "Signature status: $($signature.Status)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($signature.Status -eq 'Valid') {
            "Signed by: $($signature.SignerCertificate.Subject)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          } else {
            "The installer is UNSIGNED (no signing certificate is configured). Windows SmartScreen will warn." | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          }
      - name: Security regression tests (unit and Electron)
        run: npm run test:security
      - name: Export rendering tests
        run: npm run test:e2e:export
      - name: Core editor E2E tests
        run: npm run test:e2e:core
      - name: Run the E2E suite against the unpacked application
        run: |
          export MARKDOWN_STUDIO_EXECUTABLE="$(ls -d "$PWD"/release/*/win-unpacked)/MarkdownStudio.exe"
          npm run test:e2e
      - name: Install the installer silently and launch the installed application
        shell: pwsh
        run: |
          $installer = (Get-ChildItem release\*\Markdown-Studio-Setup-*.exe | Select-Object -First 1).FullName
          $target = Join-Path $env:RUNNER_TEMP 'MarkdownStudioInstalled'
          $process = Start-Process -FilePath $installer -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "Installer exited with $($process.ExitCode)" }
          $exe = Join-Path $target 'MarkdownStudio.exe'
          if (-not (Test-Path $exe)) { throw "MarkdownStudio.exe was not installed" }
          $info = (Get-Item $exe).VersionInfo
          "Installed: $($info.ProductName) $($info.ProductVersion)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          if ($info.ProductName -ne 'Markdown Studio') { throw "Unexpected product name: $($info.ProductName)" }
          $startMenu = Get-ChildItem "$env:APPDATA\Microsoft\Windows\Start Menu\Programs" -Filter 'Markdown Studio*.lnk' -Recurse -ErrorAction SilentlyContinue
          if (-not $startMenu) { throw 'No Start Menu shortcut was created' }
          "Start Menu shortcut: $($startMenu[0].Name)" | Tee-Object -Append $env:GITHUB_STEP_SUMMARY
          "MARKDOWN_STUDIO_INSTALLED=$exe" | Out-File -Append -Encoding utf8 $env:GITHUB_ENV
      - name: Test the installed application
        run: MARKDOWN_STUDIO_EXECUTABLE="$MARKDOWN_STUDIO_INSTALLED" npm run test:e2e:packaged
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: windows-test-results
          path: test-results/
          retention-days: 7

  macos:
    name: Package and smoke-test (macOS)
    needs: linux
    # Native platforms: main, release tags and manual runs only (never ordinary development pushes
    # or fork pull requests), and only after the Linux gates pass and code changed.
    if: needs.linux.outputs.code == 'true' && (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main')
    runs-on: macos-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Package the application (unsigned unless a certificate is configured)
        env:
          MAC_CERTIFICATE_BASE64: ${{ secrets.MAC_CERTIFICATE_BASE64 }}
          MAC_CERTIFICATE_PASSWORD: ${{ secrets.MAC_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          EXTRA=""
          if [ -n "$MAC_CERTIFICATE_BASE64" ]; then
            export CSC_LINK="$MAC_CERTIFICATE_BASE64" CSC_KEY_PASSWORD="$MAC_CERTIFICATE_PASSWORD"
            # Notarisation needs a Developer ID certificate and the Apple credentials together.
            if [ -n "$APPLE_ID" ]; then EXTRA="-c.mac.notarize=true"; fi
          else
            # No certificate: build an unsigned application and do not search the keychain.
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          npx electron-builder --mac --publish never $EXTRA
      - name: Smoke-test the packaged application
        run: |
          APP="$(ls -d release/*/mac*/'Markdown Studio.app' | head -1)"
          MARKDOWN_STUDIO_EXECUTABLE="$PWD/$APP/Contents/MacOS/Markdown Studio" npm run test:e2e:packaged
      - uses: actions/upload-artifact@v4
        with:
          name: markdown-studio-macos-dmg
          path: release/*/Markdown-Studio-*.dmg
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: macos-test-results
          path: test-results/
          retention-days: 7

  release:
    name: Draft GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    # Runs on the dedicated runner (no hosted fallback); needs the GitHub CLI installed there.
    runs-on: [self-hosted, linux, markdown-studio-linux]
    permissions:
      contents: write
    steps:
      - name: Check the GitHub CLI is available on the runner
        run: gh --version
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Compose the release notes
        run: node scripts/release-notes.mjs "$GITHUB_REF_NAME" > release-notes.md
      - name: Create a DRAFT release with the installers (nothing is published automatically)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/markdown-studio-windows-installer/*/Markdown-Studio-Setup-*.exe \
            dist/markdown-studio-linux-appimage/*/Markdown-Studio-*.AppImage \
            dist/markdown-studio-macos-dmg/*/Markdown-Studio-*.dmg \
            --repo "$GITHUB_REPOSITORY" --draft --prerelease \
            --title "Markdown Studio ${GITHUB_REF_NAME#v}" --notes-file release-notes.md
