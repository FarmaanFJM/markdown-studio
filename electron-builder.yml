# Packaging configuration. Windows is the primary target; macOS and Linux are configured so
# they can be built from their own platforms.
appId: com.farmaanfjm.markdownstudio
productName: Markdown Studio
copyright: Copyright © 2026 FarmaanFJM
directories:
  buildResources: resources/build
  output: release/${version}
# Everything is bundled by electron-vite, so the package needs only the build output.
files:
  - out/**
  - package.json
  - '!**/*.map'
  # The Copilot language server is shipped once, through extraResources, not inside the asar.
  - '!node_modules/@github/**'
win:
  # GitHub Copilot language server (MIT, from the lockfile-verified npm package), kept outside the
  # asar archive so it can be started as a program. Only the platform's own binary is included.
  extraResources:
    - from: node_modules/@github/copilot-language-server-win32-${arch}/copilot-language-server.exe
      to: copilot/copilot-language-server.exe
  target:
    - target: nsis
      arch: [x64]
  icon: resources/build/icon.ico
  executableName: MarkdownStudio
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Markdown Studio
  installerIcon: resources/build/icon.ico
  uninstallerIcon: resources/build/icon.ico
  artifactName: Markdown-Studio-Setup-${version}.${ext}
mac:
  extraResources:
    - from: node_modules/@github/copilot-language-server-darwin-${arch}/copilot-language-server
      to: copilot/copilot-language-server
  # Signing and notarisation happen only when the release workflow provides credentials.
  hardenedRuntime: true
  gatekeeperAssess: false
  target: dmg
  category: public.app-category.productivity
  icon: resources/build/icon.png
  artifactName: Markdown-Studio-${version}-${arch}.${ext}
linux:
  extraResources:
    - from: node_modules/@github/copilot-language-server-linux-${arch}/copilot-language-server
      to: copilot/copilot-language-server
  target: AppImage
  icon: resources/build/icon.png
  category: Office
  executableName: markdown-studio
  artifactName: Markdown-Studio-${version}-${arch}.${ext}
extraResources:
  - from: LICENSE
    to: LICENSE.MarkdownStudio.txt
  - from: THIRD_PARTY_NOTICES.md
    to: THIRD_PARTY_NOTICES.md
